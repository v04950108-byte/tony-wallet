<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TONY Wallet</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <main class="app">

    <section id="authScreen" class="screen">
      <div class="logo">TONY</div>

      <h1>TONY Wallet</h1>
      <p class="subtitle">Создайте аккаунт</p>

      <div id="emailStep" class="card">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        >

        <button id="sendCodeButton" type="button">
          Получить код
        </button>
      </div>

      <div id="codeStep" class="card hidden">
        <div class="backRow">
          <button id="backButton" class="backButton" type="button">
            ← Изменить email
          </button>
        </div>

        <p class="codeInfo">Код отправлен на</p>
        <strong id="emailPreview">—</strong>

        <label for="code">Код подтверждения</label>

        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
        >

        <button id="verifyCodeButton" type="button">
          Подтвердить
        </button>

        <button
          id="resendButton"
          class="secondaryButton"
          type="button"
          disabled
        >
          Отправить код повторно
        </button>

        <p id="timer" class="timer"></p>
      </div>

      <div id="message" class="message"></div>
    </section>

    <section id="walletScreen" class="screen hidden">

      <div class="walletHeader">
        <div>
          <span class="small">TONY Wallet</span>
          <h2>Добро пожаловать</h2>
        </div>

        <button id="logoutButton" class="logoutButton" type="button">
          Выйти
        </button>
      </div>

      <div class="walletCard">

        <span>Аккаунт</span>

        <strong id="walletEmail">—</strong>

        <div class="verified">
          ✓ Email подтверждён
        </div>

        <div class="walletInfo">
          <span class="infoTitle">TRON-адрес</span>

          <div class="addressRow">
            <code id="walletAddress">—</code>

            <button
              id="copyAddressButton"
              type="button"
              class="secondaryButton copyButton"
            >
              Копировать
            </button>
          </div>

          <small id="walletNetwork">
            Сеть: —
          </small>
        </div>

      </div>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
